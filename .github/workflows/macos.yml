name: macOS build

# 在 macOS runner 上打 dmg/zip，并上传到 Release。
# 版本号按你的要求打成 1.0.0（macOS 首个版本），功能与 Windows 1.3.0 同一份代码。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'macOS 版本号'
        required: false
        default: '1.0.0'
      tag:
        description: '上传到哪个 Release tag'
        required: false
        default: 'v1.0.0-macos'
  push:
    tags:
      - 'v*-macos'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund

      # macOS 26/27 上 Electron 33 的 Skia fontations 后端会崩（见 PR #1），mac 构建用 43
      - name: Use Electron 43 for macOS
        run: |
          npm install --no-save --no-audit --no-fund electron@43.8.3
          node -e "console.log('electron', require('electron/package.json').version)"

      - name: Build dmg / zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          # --publish never：只打包。electron-builder 在 CI 里会默认尝试发布，
          # 没配 GH_TOKEN 就直接报错；发布交给下面的 gh release upload 步骤。
          npx electron-builder --mac --x64 --arm64 --publish never \
            -c.extraMetadata.version=${{ github.event.inputs.version || '1.0.0' }} \
            -c.mac.identity=null

      - name: List artifacts
        run: ls -lh dist | head -40

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v1.0.0-macos' }}
        run: |
          set -e
          # 没有这个 tag 就先建一个草稿 release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "FCL 1.0.0 for macOS" \
              --notes "macOS 首个版本，功能与 Windows 1.3.0 一致。" \
              --draft
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: fcl-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
