name: macOS build

# 在 macOS runner 上打 dmg/zip，并上传到 Release。
# 版本号按你的要求打成 1.0.0（macOS 首个版本），功能与 Windows 1.3.0 同一份代码。
#
# 关于签名：没有 Apple 开发者证书，所以用 **ad-hoc 签名**（codesign -s -）。
# 这一步对 Apple Silicon 是必须的 —— arm64 的二进制如果没有有效签名，内核会直接拒绝执行，
# 用户看到的是「应用已损坏」。ad-hoc 之后只需要右键 → 打开 就能跑。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'macOS 版本号'
        required: false
        default: '1.0.0'
      tag:
        description: '上传到哪个 Release tag'
        required: false
        default: 'v1.0.0-macos'
  push:
    tags:
      - 'v*-macos'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # macOS 26/27 上 Electron 33 的 Skia fontations 后端会崩（见 PR #1），mac 构建用 43
      - name: Use Electron 43 for macOS
        run: |
          npm install --no-save --no-audit --no-fund electron@43.8.3
          node -e "console.log('electron', require('electron/package.json').version)"

      - name: Pack .app (no signing)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          # --dir 只产出 .app，先不签名也不打安装包
          npx electron-builder --mac --x64 --arm64 --dir --publish never \
            -c.extraMetadata.version=$APP_VERSION \
            -c.mac.identity=null

      - name: Ad-hoc sign .app bundles
        run: |
          set -e
          for APP in dist/mac/FCL.app dist/mac-arm64/FCL.app; do
            if [ -d "$APP" ]; then
              echo "==> signing $APP"
              codesign --force --deep --sign - "$APP"
              codesign --verify --deep --strict --verbose=2 "$APP"
              echo "==> entitlements / signature info"
              codesign -dv --verbose=4 "$APP" 2>&1 | head -12
            fi
          done

      - name: Build dmg / zip from signed apps
        run: |
          set -e
          npx electron-builder --mac dmg zip --x64 --prepackaged dist/mac/FCL.app --publish never \
            -c.extraMetadata.version=$APP_VERSION \
            -c.mac.identity=null
          npx electron-builder --mac dmg zip --arm64 --prepackaged dist/mac-arm64/FCL.app --publish never \
            -c.extraMetadata.version=$APP_VERSION \
            -c.mac.identity=null

      - name: Verify artifacts
        run: |
          set -e
          ls -lh dist/*.dmg dist/*.zip
          # 抽查 dmg 里的 .app 是否带签名
          for DMG in dist/*.dmg; do
            echo "==> $DMG"
            MNT=$(mktemp -d)
            hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
            codesign -dv --verbose=2 "$MNT/FCL.app" 2>&1 | head -6 || true
            hdiutil detach "$MNT" -quiet
          done

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v1.0.0-macos' }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "FCL 1.0.0 for macOS" \
              --notes "macOS 首个版本，功能与 Windows 1.3.0 一致。" \
              --draft
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: fcl-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
