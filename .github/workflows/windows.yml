name: windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem -Recurse -Filter *.js -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\|\\dist\\' } |
            ForEach-Object {
              node --check $_.FullName
              if ($LASTEXITCODE -ne 0) { $failed += $_.FullName }
            }
          if ($failed.Count) { throw "syntax errors: $($failed -join ', ')" }

      - name: Package (portable exe, unsigned)
        run: npx electron-builder --win portable --x64

      - name: Verify build output
        shell: pwsh
        run: |
          $asar = "dist/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asar)) { throw "missing $asar" }
          "app.asar = {0:N0} bytes" -f (Get-Item $asar).Length
          $exe = Get-ChildItem dist -Filter "FCL-*-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "没有生成 portable exe" }
          "exe = {0} ({1:N0} bytes)" -f $exe.Name, $exe.Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCL-win-x64
          path: |
            dist/FCL-*-x64.exe
            dist/win-unpacked/resources/app.asar
          if-no-files-found: error
